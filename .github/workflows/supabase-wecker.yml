# «Будильник» для Supabase: раз в 3 дня отправляет в базу безопасный запрос,
# чтобы бесплатный проект не уснул после недели без активности.
#
# Запрос заведомо неверный (пустое имя), поэтому база его отклоняет с кодом E_NAME
# и НИЧЕГО не сохраняет. Заявки он не читает и не меняет.
# Если база недоступна (спит, удалена) – запуск станет красным, GitHub пришлёт письмо.
#
# Вручную: GitHub → Actions → «Supabase wach halten» → Run workflow.

name: Supabase wach halten

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anpingen
        env:
          URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -u
          TOKEN=$(cat /proc/sys/kernel/random/uuid)
          BODY=$(printf '{"p_client_token":"%s","p_typ":"probestunde","p_name":"","p_email":"","p_telefon":"","p_altersgruppe":null,"p_alter_kind":null,"p_wunschdatum":null,"p_wunschzeit":null,"p_nachricht":null,"p_datenschutz":false,"p_website":"","p_ausfuellzeit":10000}' "$TOKEN")
          RESPONSE=$(curl -sS --max-time 30 -X POST "$URL/rest/v1/rpc/anfrage_senden" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d "$BODY")
          echo "Antwort der Datenbank: $RESPONSE"
          echo "$RESPONSE" | grep -q "E_NAME" || { echo "Unerwartete Antwort - Datenbank prüfen!"; exit 1; }
          echo "Datenbank ist aktiv."
